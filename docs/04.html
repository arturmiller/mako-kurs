<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'04',minutes:15,title:'Lokationsbündel und Messkonzepte',lede:'Komplexe Versorgung ist kein Sonderfall-Boolean, sondern ein zeitabhängiger Graph aus Markt- und Messobjekten.',objectives:['1:n- und n:m-Beziehungen zwischen Markt- und Messlokationen akzeptieren','Tranchen als Zuordnungen statt als Kopien modellieren','Berechnungslogik von physischer Topologie trennen'],chapters:[{title:'Der Graph statt der Tabelle',html:'<p>PV-Anlage, Wärmepumpe, Speicher und Haushalt können über mehrere Messungen rechnerisch zusammenhängen. Eine einzelne <code>meterId</code>-Spalte an der MaLo bricht bei solchen Konstellationen.</p><pre class="model">MeLo A ─┐\n        ├─ CalculationRule ─▶ MaLo Verbrauch\nMeLo B ─┘                 └▶ MaLo Erzeugung</pre>'},{title:'Zuordnung als eigenes Fachobjekt',html:'<p>Eine Tranche beschreibt einen Anteil bzw. eine Zuordnung mit Gültigkeit. Sie ist weder eine zweite MaLo noch bloß ein Prozentfeld am Vertrag.</p><p class="callout">Versioniere Knoten, Kanten und Berechnungsregeln. Sonst lässt sich eine historische Energiemenge später nicht reproduzieren.</p>'}],quiz:[{question:'Welche Struktur trägt komplexe Messkonzepte am besten?',options:['Eine MaLo mit genau einer meterId','Ein zeitabhängiger Zuordnungsgraph','Ein Freitextfeld'],answer:1},{question:'Was muss für eine historische Neuberechnung erhalten bleiben?',options:['Nur der aktuelle Zähler','Damals gültige Beziehungen und Berechnungsregeln','Nur die Kundenadresse'],answer:1}],task:{title:'Baue ein prüfbares Rechenmodell',prompt:'Welche drei Ebenen würdest du getrennt halten?',answer:'<ol><li>Topologie: MaLo, MeLo, Geräte und zeitliche Beziehungen</li><li>Rohdaten: Werte, Qualität, Quelle und Version</li><li>Ableitung: versionierte Berechnungsregel plus Ergebnis und Provenienz</li></ol>'},sources:[['Bundesnetzagentur: WiM','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/833_wim/wim_basepage.html'],['Bundesnetzagentur: Datenformate','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/835_mitteilungen_datenformate/Datenformate-node.html']],prev:'03',next:'05'};</script><script src="app.js"></script></body></html>
