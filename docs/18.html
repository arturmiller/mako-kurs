<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'18',minutes:45,title:'Komplexe Tarife und regulatorische Preisbestandteile',lede:'Reale Preise sind keine feste Zahl am Vertrag. Sie sind versionierte Regeln, die Mengen, Zeitfenster, Schwellen und regulatorische Bestandteile bewerten.',objectives:['Preisplan, Preisregel und Preisversion trennen','Staffeln, Boni und dynamische Preise modellieren','regulatorische Bestandteile zeitlich anwenden','eine reproduzierbare Rating Engine entwerfen'],chapters:[{title:'Warum pricePerKwh nicht genügt',html:'<p>Ein einfacher Arbeitspreis kann als Geldbetrag pro Kilowattstunde erscheinen. Reale Produkte kombinieren Grundpreis, Arbeitspreis, Staffelgrenzen, Boni, Laufzeiten und Preisgarantien. Hinzu kommen Netzentgelte, Umlagen, Steuern und Konzessionsabgabe. Jeder Bestandteil besitzt eigene Gültigkeit und Berechnungsbasis.</p><p>Eine Spalte price am Vertrag verliert Herkunft, Version und Regelart. Stattdessen referenziert der Vertrag einen Preisplan. Der Preisplan enthält versionierte Komponenten und Bedingungen. Eine Änderung beendet die alte Version und beginnt eine neue, ohne historische Rechnungen umzudeuten.</p>'},{title:'Staffeln, Boni und Vertragsbedingungen',html:'<p>Bei Staffelpreisen hängt der Preis von Verbrauchsgrenzen oder Zonen ab. Das System muss unterscheiden, ob eine erreichte Schwelle den gesamten Verbrauch oder nur den Anteil oberhalb der Schwelle bewertet. Boni können einmalig, pro Zeitraum oder an Mindestlaufzeit und Zahlungsstatus gebunden sein.</p><p>Vertragslaufzeit und Preisregel sind getrennte Konzepte. Eine Mindestvertragslaufzeit entscheidet über Kündigungsmöglichkeiten, nicht direkt über den Preis. Eine Preisgarantie kann bestimmte Bestandteile einschließen und andere regulatorische Änderungen ausnehmen. Diese Bedingungen gehören explizit ins Regelmodell.</p>'},{title:'Dynamische und zeitvariable Tarife',html:'<p>Zeitvariable Tarife verwenden definierte Zeitfenster mit unterschiedlichen Preisen. Dynamische Tarife können stündliche Marktpreise oder andere externe Zeitreihen einbeziehen. Die Rating Engine muss Messintervalle mit der passenden Preiszeitreihe verbinden, Zeitzonen und Zeitumstellungen korrekt behandeln und fehlende Preise als Klärfall erkennen.</p><p>Ein stündlicher Preis ist ein versionierter Input. Die Rechnung referenziert genau die verwendete Preiszeitreihe. Spätere Datenkorrekturen lösen eine kontrollierte Neubewertung aus, nicht die stille Änderung einer bereits versendeten Rechnung.</p>'},{title:'Regulatorische Bestandteile und Paragraph 14a',html:'<p>Netzentgelte, Umlagen, Steuern und Konzessionsabgabe ändern sich nach eigenen Regeln und Stichtagen. Steuerbare Verbrauchseinrichtungen nach Paragraph 14a des Energiewirtschaftsgesetzes können je nach gewähltem Modul besondere Netzentgeltlogiken auslösen. Das konkrete Regelwerk muss in einer datierten Version abgebildet werden.</p><p>Die Engine segmentiert den Abrechnungszeitraum an jeder relevanten Grenze: Tarifwechsel, Preisversion, Steuerregel, regulatorischer Bestandteil, Messkonfiguration und gegebenenfalls Stundenpreis. Der Calculation Trace dokumentiert Eingaben, Zwischenergebnisse, Rundung und Endbetrag.</p><pre class="model">PricePlan enthält PriceComponents\nPriceComponent besitzt Formula, Conditions und Validity\nRatingSegment verbindet QuantityVersion und PriceRuleVersion\nCalculationTrace erklärt jeden Rechnungsbetrag</pre>'}],quiz:[{question:'Warum ist ein einzelnes Preisfeld unzureichend?',options:['Weil Preise nie Zahlen enthalten','Weil Komponenten, Bedingungen und Gültigkeiten verloren gehen','Weil Rechnungen keine Preise brauchen'],answer:1},{question:'Was unterscheidet Staffel und Zone?',options:['Ob der Preis auf Gesamtmenge oder Mengenanteile wirkt','Nur die Farbe','Nichts'],answer:0},{question:'Was benötigt ein dynamischer Tarif?',options:['Zeitlich passende Mess- und Preisreihen','Nur einen Jahreswert','Keine Versionierung'],answer:0}],task:{title:'Modelliere einen dynamischen Tarif',prompt:'Kombiniere Grundpreis, stündlichen Energiepreis und ein Paragraph-14a-Modul.',answer:'<p>Der Preisplan enthält getrennte Komponenten. Der Grundpreis nutzt eine Proratisierungsregel. Der Energiepreis verbindet jedes Messintervall mit der versionierten Stundenpreisreihe. Das Netzentgeltmodul prüft Konfiguration und Gültigkeit der steuerbaren Verbrauchseinrichtung. Der Trace dokumentiert alle drei Ergebnisse.</p>'},sources:[['Bundesnetzagentur: Netzentgelte','https://www.bundesnetzagentur.de/DE/Fachthemen/ElektrizitaetundGas/Netzentgelte/start.html'],['Bundesnetzagentur: steuerbare Verbrauchseinrichtungen','https://www.bundesnetzagentur.de/DE/Vportal/Energie/SteuerbareVBE/artikel.html'],['EnWG Paragraph 14a','https://www.gesetze-im-internet.de/enwg_2005/__14a.html']],prev:'17',next:'19'};</script><script src="app.js"></script></body></html>
