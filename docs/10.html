<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'10',minutes:30,title:'MaBiS-Hub einordnen',lede:'Der MaBiS-Hub ist ein regulatorisches Zielbild für eine stärker zentralisierte Verarbeitung bilanzierungsrelevanter Daten. Entscheidend ist, Gesichertes und noch Offenes auseinanderzuhalten.',objectives:['die Aufgabe der Bilanzkreisabrechnung im Gesamtbild erklären','heutige MaBiS-Prozesse vom künftigen Hub-Zielbild trennen','Konsultationsaussagen mit dem richtigen Sicherheitsgrad modellieren','eine migrationsfähige Softwaregrenze entwerfen'],chapters:[{kicker:'Rückblick',title:'Warum Bilanzierung nach der Belieferung kommt',html:'<p>Die vorherigen Lektionen folgten einer einzelnen Marktlokation: Sie wurde einem Lieferanten zugeordnet, Messwerte wurden verarbeitet und Energiemengen bewertet. Für das Gesamtsystem reicht die einzelne Kundenrechnung jedoch nicht. Der Strommarkt muss fortlaufend bestimmen, welche Energiemengen den Bilanzkreisen und damit den verantwortlichen Marktakteuren zuzurechnen sind.</p><p>Ein Bilanzkreis ist eine energiewirtschaftliche Verantwortungsstruktur. Vereinfacht werden Einspeisung und Entnahme prognostiziert und bilanziell zusammengeführt. Abweichungen zwischen geplanter und tatsächlicher Situation müssen festgestellt und finanziell behandelt werden. Dafür werden sehr viele Stamm-, Zuordnungs- und Messdaten aus dem Markt zusammengeführt.</p><p class="callout">MaBiS ist nicht Kundenbilling. Beide verwenden Energiemengen, beantworten aber unterschiedliche Fragen: Kundenbilling bewertet die Belieferung eines Kunden; Bilanzkreisabrechnung ordnet Mengen und Abweichungen marktweit Verantwortlichen zu.</p>'},{kicker:'Heutiges System',title:'Warum dezentrale Datenketten schwierig werden',html:'<p>Im bestehenden Markt entstehen bilanzierungsrelevante Daten bei unterschiedlichen Rollen. Messstellenbetreiber liefern Werte, Netzbetreiber kennen Zuordnungen und bilden bzw. übermitteln Aggregate, Übertragungsnetzbetreiber benötigen Ergebnisse für die Bilanzkreisabrechnung. Korrekturen können dieselbe Kette erneut durchlaufen.</p><div class="flow"><div class="node">Messwerte</div><span class="arrow">→</span><div class="node">Zuordnungen</div><span class="arrow">→</span><div class="node">Aggregation</div><span class="arrow">→</span><div class="node">Bilanzkreis-<br>abrechnung</div></div><p>Das Problem ist nicht nur Datenmenge. Wenn Beteiligte verschiedene Stände derselben Zuordnung oder unterschiedliche Wertversionen verwenden, entstehen Differenzen. Clearing wird dann zur Suche nach der Stelle, an der sich die Sichten getrennt haben.</p>'},{kicker:'Zielbild',title:'Was der MaBiS-Hub verändern soll',html:'<p>Im Festlegungsverfahren BK6-24-210 arbeitet die Bundesnetzagentur an der zukünftigen Aggregation und Abrechnung bilanzierungsrelevanter Daten. Das diskutierte Zielbild bündelt Aufgaben stärker in einem zentralen MaBiS-Hub. Dadurch sollen Datenverarbeitung, Aggregation, Ergebniserzeugung und Clearing in einer konsistenteren Infrastruktur zusammenlaufen.</p><p>Für einen Softwarearchitekten ist wichtig: Ein Zielbild beschreibt eine Richtung, aber nicht automatisch eine bereits verbindliche Produktionsschnittstelle. Rollenabgrenzung, Verantwortlichkeiten, Datenqualität, Fristen und konkrete technische Formate hängen vom jeweils aktuellen Verfahrens- und Umsetzungsstand ab.</p><p class="callout"><strong>Sicherheitsregel:</strong> Beschluss, gültige Anlage, Konsultationsentwurf und Branchenstellungnahme sind verschiedene Quellentypen. Speichere eine Annahme nie ohne ihren regulatorischen Status.</p>'},{kicker:'Architektur',title:'Unter Unsicherheit stabil modellieren',html:'<p>Die stabilen Fachkonzepte gehören in den Kern: Marktlokation, zeitliche Zuordnung, Messwertversion, Energiemenge, Bilanzkreis und Aggregationsergebnis. Die heute verwendeten Nachrichten und ein künftiges Hub-API gehören hinter Adapter.</p><pre class="model">                    ┌─ Adapter: heutige MaBiS-Nachrichten\nDomänenmodell ◀─ Port ┤\n                    └─ Adapter: MaBiS-Hub / API-Zielbild\n\nRegulatoryDecisionRegister\n  ├─ Aussage + Quelle + Veröffentlichungsdatum\n  ├─ Status: Entwurf | beschlossen | in Kraft\n  ├─ betroffene Komponenten\n  └─ Trigger zur erneuten Prüfung</pre><p>So kann das Team bereits fachliche Fähigkeiten bauen, ohne ungesicherte Feldnamen oder Prozessdetails tief einzubrennen. Wird ein Beschluss veröffentlicht oder eine neue Formatversion verbindlich, prüft ein klarer Trigger die betroffenen Adapter und Regeln.</p>'},{kicker:'Durchgängiges Beispiel',title:'Eine Korrektur durch das System verfolgen',html:'<p>Angenommen, für eine Marktlokation trifft nachträglich eine korrigierte Messwertversion ein. Im Kundenbilling kann daraus eine korrigierte Rechnung entstehen. In der Bilanzierung kann dieselbe Korrektur ein Aggregat und ein Bilanzierungsergebnis verändern.</p><p>Ein gutes System überschreibt weder den Messwert noch das alte Aggregat. Es erzeugt neue Versionen und hält die Herkunftskette fest: Welche Eingabeversion führte mit welcher Regelversion zu welchem Ergebnis? Diese Fähigkeit bleibt unabhängig davon wertvoll, ob die Verarbeitung dezentral oder künftig über einen Hub erfolgt.</p>'}],quiz:[{question:'Welche Frage beantwortet MaBiS primär?',options:['Welche Schriftart die Kundenrechnung nutzt','Wie bilanzierungsrelevante Energiemengen aggregiert und abgerechnet werden','Welcher Zähler physisch montiert wird'],answer:1},{question:'Wie behandelst du eine Aussage aus einem Konsultationspapier?',options:['Als bereits geltende Produktionsspezifikation','Als versionierte Annahme mit offenem Entscheidungsstatus','Wie einen finalen Gerichtsbeschluss'],answer:1},{question:'Was gehört hinter einen Adapter?',options:['Stabile Fachbegriffe wie Bilanzkreis und Messwertversion','Konkrete Nachrichten- oder API-Schemas','Jede Domäneninvariante'],answer:1}],task:{title:'Entwirf eine migrationsfähige Grenze',prompt:'Notiere drei stabile Domänenobjekte, zwei austauschbare Adapter und einen Trigger, der eine Architekturprüfung auslöst.',answer:'<p>Beispiel: <code>EnergyQuantity</code>, <code>BalanceAssignment</code> und <code>AggregationResult</code> bleiben im Kern. Ein heutiger EDI@Energy-Adapter und ein künftiger Hub-API-Adapter übersetzen Transportmodelle. Trigger: Veröffentlichung eines finalen Beschlusses samt verbindlicher technischer Anlagen oder Inkrafttreten einer neuen Formatversion.</p><p>Markiere dabei jede noch offene Annahme. Wenn du ihren Status nicht sicher einordnen kannst, frage den Agenten unter Angabe der Quelle und des Veröffentlichungsdatums.</p>'},sources:[['Bundesnetzagentur: Verfahren BK6-24-210','https://www.bundesnetzagentur.de/DE/Beschlusskammern/1_GZ/BK6-GZ/2024/BK6-24-210/BK6-24-210_verfahren.html'],['Bundesnetzagentur: Datenformate und API-Mitteilungen','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/835_mitteilungen_datenformate/Datenformate-node.html']],prev:'09'};</script><script src="app.js"></script></body></html>
