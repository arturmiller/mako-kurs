<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'10',minutes:15,title:'MaBiS-Hub einordnen',lede:'Der MaBiS-Hub ist ein regulatorisches Zielbild für stärkere Zentralisierung – kein Grund, heutige Systeme an ungeklärte Details zu koppeln.',objectives:['heutige MaBiS-Aufgaben vom künftigen Hub-Zielbild trennen','gesicherte Aussagen und Entwurfsannahmen markieren','eine migrationsfähige Anti-Corruption-Layer entwerfen'],chapters:[{title:'Heute und Zielbild',html:'<p>MaBiS regelt Aggregation und Bilanzkreisabrechnung im Strommarkt. Im Verfahren BK6-24-210 wird ein zentraler MaBiS-Hub als künftige Infrastruktur ausgestaltet. Rollen, Clearing und Verantwortungszuschnitt sind deshalb versions- und verfahrensabhängig.</p><div class="flow"><div class="node">Mess- &amp;<br>Stammdaten</div><span class="arrow">→</span><div class="node">Aggregation</div><span class="arrow">→</span><div class="node">Bilanzierungs-<br>ergebnis</div><span class="arrow">→</span><div class="node">Clearing</div></div>'},{title:'Architektur unter Unsicherheit',html:'<p>Stabile Fachbegriffe gehören in den Kern. Konkrete Nachrichten, API-Schemas, Rollenbezeichnungen und Fristen gehören hinter versionierte Adapter.</p><pre class="model">Domain ◀─ Port ─ Adapter MaBiS heute\n             └─ Adapter Hub-Zielbild (später)</pre><p class="callout"><strong>Status-Hinweis:</strong> Behandle Konsultationspapiere als Zielbild, nicht als bereits geltende Produktionsspezifikation. Prüfe vor Umsetzung den aktuellen Verfahrensstand.</p>'}],quiz:[{question:'Wie sollte ein Konsultationsentwurf behandelt werden?',options:['Als unveränderliche Produktionsspezifikation','Als versionierte Annahme mit offenem Entscheidungsstatus','Als bedeutungslos'],answer:1},{question:'Was schützt den Domänenkern vor Formatwechseln?',options:['Transportobjekte überall verwenden','Ports und Anti-Corruption-Adapter','Alle Regeln hardcoden'],answer:1}],task:{title:'Führe ein Decision Register',prompt:'Welche Metadaten braucht eine Annahme zum MaBiS-Hub?',answer:'<pre class="model">Assumption { statement, source, sourceDate, status,\n             affectedComponents, validationTrigger, owner }</pre><p>Ein Trigger kann etwa „finaler Beschluss veröffentlicht“ oder „neue EDI@Energy/API-Version in Kraft“ sein. So wird regulatorische Unsicherheit sichtbar und wartbar.</p>'},sources:[['Bundesnetzagentur: Verfahren BK6-24-210','https://www.bundesnetzagentur.de/DE/Beschlusskammern/1_GZ/BK6-GZ/2024/BK6-24-210/BK6-24-210_verfahren.html'],['Bundesnetzagentur: Datenformate und API-Mitteilungen','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/835_mitteilungen_datenformate/Datenformate-node.html']],prev:'09'};</script><script src="app.js"></script></body></html>
