<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'10',minutes:35,title:'Netznutzungsabrechnung',lede:'Der Lieferant ist nicht nur Rechnungssteller. Gegenüber dem Netzbetreiber wird er selbst zum Rechnungsempfänger und muss fremde Forderungen fachlich prüfen.',objectives:['Kundenrechnung und Netznutzungsrechnung unterscheiden','INVOIC und REMADV in den Prüfprozess einordnen','Mengen-, Preis- und Zuordnungsfehler systematisch erkennen','aus einer akzeptierten Rechnung einen kreditorischen Beleg erzeugen'],chapters:[{title:'Zwei Rechnungswelten',html:'<p>Die Kundenrechnung bewertet das Lieferverhältnis zwischen Lieferant und Kunde. Die Netznutzungsrechnung bewertet Leistungen des Netzbetreibers gegenüber dem Lieferanten beziehungsweise Netznutzer. Beide können dieselbe Marktlokation und denselben Zeitraum betreffen, aber sie haben andere Vertragspartner, Preisgrundlagen und Buchungsrichtungen.</p><p>Netznutzungsentgelte vergüten die Nutzung der Netzinfrastruktur. Je nach Konstellation kommen Messentgelte oder weitere Preisbestandteile hinzu. Im Lieferantensystem entsteht daher kein Debitorenbeleg gegen den Kunden, sondern ein kreditorischer Vorgang: Eine Eingangsrechnung muss geprüft, gebucht und zur Zahlung freigegeben oder begründet abgelehnt werden.</p>'},{title:'INVOIC und REMADV',html:'<p>Der Netzbetreiber übermittelt die Rechnung elektronisch als INVOIC. Der Lieferant prüft sie und kommuniziert die Zahlungsentscheidung über REMADV. Eine positive REMADV bestätigt die Zahlung akzeptierter Rechnungen. Eine negative REMADV weist eine Rechnung oder Position mit fachlichem Grund zurück und eröffnet die Klärung.</p><p>Eine technische Empfangsbestätigung ersetzt diese fachliche Entscheidung nicht. Das System muss deshalb Nachrichteneingang, technische Lesbarkeit, fachliche Rechnungsprüfung und Zahlung als getrennte Zustände führen.</p><pre class="model">NetworkInvoice { invoiceId, gridOperator, period, positions, amount, dueDate }\nInvoiceCheck { quantityCheck, priceCheck, assignmentCheck, taxCheck }\nPaymentDecision { acceptedAmount, rejectedPositions, reasonCodes }</pre>'},{title:'Die fachliche Prüfung',html:'<p>Die Mengenprüfung vergleicht abgerechnete Kilowattstunden, Leistungswerte und Zeiträume mit den im eigenen System akzeptierten Mess- und Energiemengen. Die Preisprüfung verwendet die für Netzgebiet, Spannungsebene, Kundengruppe und Zeitraum gültigen Preisblätter. Die Zuordnungsprüfung beantwortet, ob der Lieferant im berechneten Zeitraum überhaupt der Marktlokation zugeordnet war.</p><p>Abweichungen dürfen nicht in einem einzigen Status verschwinden. Eine falsche Menge erfordert andere Nachweise als ein falscher Preis oder eine Rechnung für eine fremde Marktlokation. Jede Prüfregel sollte Eingabedaten, Regelversion, Ergebnis und Toleranz dokumentieren. Nur so kann die Ablehnung später erklärt und nach einer Korrektur gezielt erneut geprüft werden.</p>'},{title:'Vom Prüfergebnis zur Buchung',html:'<p>Bei vollständiger Akzeptanz entsteht ein kreditorischer Beleg mit Fälligkeit und Kontierung. Bei Teilakzeptanz muss das System die fachlich akzeptierte und die strittige Summe getrennt behandeln. Eine Zahlungsfreigabe ist eine eigene Entscheidung und darf nicht allein daraus folgen, dass die Nachricht syntaktisch gültig war.</p><p>Der wichtigste Architekturgedanke lautet: Die Originalrechnung bleibt unverändert. Prüfergebnisse, REMADV, Klärfälle, Korrekturrechnungen und Zahlungen werden als eigene, miteinander verknüpfte Objekte gespeichert.</p>'}],quiz:[{question:'Welche Nachricht transportiert typischerweise die Netznutzungsrechnung?',options:['INVOIC','REMADV','CONTRL'],answer:0},{question:'Was prüft die Zuordnungsprüfung?',options:['Ob die Datei komprimiert ist','Ob der Lieferant im Rechnungszeitraum der Marktlokation zugeordnet war','Ob der Kunde eine E-Mail-Adresse hat'],answer:1},{question:'Wann darf eine Rechnung zur Zahlung freigegeben werden?',options:['Sobald irgendeine Nachricht eingetroffen ist','Nach dokumentierter fachlicher Prüfung und Freigabe','Erst nach der Kundenmahnung'],answer:1}],task:{title:'Entwirf eine Prüfentscheidung',prompt:'Modelliere eine Rechnung, deren Menge stimmt, deren Preis aber ab dem Monatswechsel falsch ist.',answer:'<p>Speichere die INVOIC unverändert. Erzeuge pro Position Ergebnisse für Mengen-, Preis- und Zuordnungsprüfung. Die Preisprüfung referenziert die erwartete Preisversion und markiert nur die betroffenen Zeitsegmente. Die Zahlungsentscheidung weist diese Positionen mit Reason Code zurück; akzeptierte Positionen bleiben separat nachvollziehbar.</p>'},sources:[['Bundesnetzagentur: INVOIC und REMADV Anwendungshandbuch','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/835_mitteilungen_datenformate/Mitteilung_32/Anlagen/EDIFACT/INVOIC_REMADV_AHB_2_5b.pdf?__blob=publicationFile&v=2'],['Bundesnetzagentur: elektronische Netznutzungsabrechnung','https://www.bundesnetzagentur.de/DE/Beschlusskammern/1_GZ/BK6-GZ/2020/BK6-20-289/BK6-20-289_beschluss.pdf?__blob=publicationFile&v=1']],prev:'09',next:'11'};</script><script src="app.js"></script></body></html>
