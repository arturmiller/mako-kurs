<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'17',minutes:40,title:'Gas als eigene Fachdomäne',lede:'Gas teilt Marktrollen und manche Prozessmuster mit Strom, besitzt aber eigene physikalische Größen, Zeitlogiken und Bilanzierungsregeln.',objectives:['gemeinsame und spartenspezifische Konzepte erkennen','Kubikmeter fachlich korrekt in Kilowattstunden umrechnen','Gaswirtschaftstag und rückwirkende Prozesse berücksichtigen','Strom und Gas in der Architektur bewusst trennen'],chapters:[{title:'Gemeinsame Sprache, andere Physik',html:'<p>Auch im Gasmarkt gibt es Lieferanten, Netzbetreiber, Messstellenbetreiber, Markt- und Messlokationen sowie standardisierte Marktkommunikation. GeLi Gas beschreibt Geschäftsprozesse des Lieferantenwechsels. Diese Ähnlichkeiten rechtfertigen gemeinsame technische Fähigkeiten für Nachrichten, Rollen, Zeitintervalle und Prozesssteuerung.</p><p>Die Energiemenge entsteht jedoch anders. Ein Gaszähler misst typischerweise ein Volumen in Kubikmetern. Für die Abrechnung wird dieses Volumen unter Einbeziehung von Brennwert und Zustandszahl in Kilowattstunden umgerechnet. Diese Faktoren sind fachliche Eingaben mit Zeitraum, Quelle und Qualität.</p>'},{title:'Von Kubikmetern zu Kilowattstunden',html:'<p>Der Brennwert beschreibt den Energieinhalt des Gases. Die Zustandszahl korrigiert das gemessene Betriebsvolumen auf einen definierten Normzustand. Vereinfacht ergibt sich die Energie aus Volumen, Zustandszahl und Brennwert. Jede Größe kann sich zeitlich ändern und muss für den Abrechnungszeitraum richtig zugeordnet werden.</p><p>Das System speichert nicht nur das Endergebnis. Es hält Volumendifferenz, verwendete Faktoren, Gültigkeitszeiträume, Einheiten und Rundungsregel fest. So kann eine Rechnung nach einer Korrektur des Brennwertes reproduziert werden.</p><pre class="model">Gasenergie in Kilowattstunden ergibt Volumen in Kubikmetern mal Zustandszahl mal Brennwert</pre>'},{title:'Allokation und Gaswirtschaftstag',html:'<p>SLP- und RLM-Verfahren existieren auch im Gasmarkt, folgen aber den gaswirtschaftlichen Allokations- und Bilanzierungsregeln. Marktgebiet, Netzgebiete, Bilanzkreis und Allokationszeitreihen bilden eigene Fachobjekte. Ein Gaswirtschaftstag ist nicht zwangsläufig identisch mit dem kalendarischen Tag.</p><p>Rückwirkende An- und Abmeldungen sowie Korrekturen spielen im Gasmarkt eine besondere Rolle. Prozessfristen und erlaubte Rückwirkungen dürfen daher nicht aus dem Strommodell kopiert werden. Ein gemeinsamer Process-Typ mit hart codierten Stromfristen wäre eine gefährliche Abstraktion.</p>'},{title:'Gemeinsamer Kern und Spartenmodule',html:'<p>Gemeinsam nutzbar sind Identitäten, Rollenbindungen, bitemporale Fakten, Nachrichtenarchiv, Idempotenz, Workflow-Infrastruktur und Audit-Trail. Spartenspezifisch bleiben Messwertumrechnung, Bilanzierungsverfahren, Fristen, Nachrichtenausprägungen und Preislogik.</p><p>Eine gute Architektur teilt Mechanismen, nicht unpassende Fachregeln. Der Domänenkern kann einen gemeinsamen Begriff EnergyQuantity besitzen, aber die Erzeugung einer Strommenge und einer Gasenergiemenge erfolgt in getrennten Services mit eigenen Invarianten.</p>'}],quiz:[{question:'Was misst ein Gaszähler typischerweise unmittelbar?',options:['Volumen in Kubikmetern','Immer Kilowattstunden','Euro'],answer:0},{question:'Welche Faktoren werden zur Energieumrechnung benötigt?',options:['Brennwert und Zustandszahl','Nur die Postleitzahl','REMADV und CONTRL'],answer:0},{question:'Was sollte Strom und Gas gemeinsam nutzen?',options:['Jede einzelne Fachregel','Technische Mechanismen wie Zeitversionierung und Audit','Immer dieselben Fristen'],answer:1}],task:{title:'Schneide die Sparten sauber',prompt:'Ordne fünf Fähigkeiten einem gemeinsamen Kern oder einem Gasmodul zu.',answer:'<p>Gemeinsam: Marktpartneridentität, Nachrichtenarchiv, temporale Fakten und Workflow-Technik. Gasmodul: Volumen-Energie-Umrechnung, Gaswirtschaftstag, gaswirtschaftliche Allokation und GeLi-Gas-spezifische Fristen.</p>'},sources:[['Bundesnetzagentur: GPKE und GeLi Gas','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_81_GPKE_GeLi/BK6_GPKE_u_GeLi_Gas.html'],['Bundesnetzagentur: Datenformate Gas','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/835_mitteilungen_datenformate/Datenformate-node.html']],prev:'16',next:'18'};</script><script src="app.js"></script></body></html>
