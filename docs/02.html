<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'02',minutes:12,title:'Marktrollen und Verantwortung',lede:'Ein Unternehmen kann mehrere Rollen spielen. Prozesse adressieren Rollen – nicht Logos.',objectives:['LF, NB, MSB, ÜNB und BKV anhand ihrer Verantwortung unterscheiden','Rolle, Organisation und Marktpartner-ID auseinanderhalten','Autorisierung aus der Rolle ableiten'],chapters:[{title:'Die fünf Perspektiven',html:'<div class="flow"><div class="node">LF<br><small>beliefert</small></div><div class="node">NB<br><small>ordnet zu</small></div><div class="node">MSB<br><small>misst</small></div><div class="node">BKV<br><small>bilanziert</small></div><div class="node">ÜNB<br><small>Systemgebiet</small></div></div><p>Die Abkürzungen beschreiben Verantwortungen. Ein Stadtwerk kann zugleich Lieferant, Netzbetreiber und Messstellenbetreiber sein – fachlich bleiben es getrennte Hüte.</p>'},{title:'Architekturregel',html:'<pre class="model">MarketParty ── plays ──▶ MarketRole\nMarketRole  ── valid during ──▶ Period\nMessage     ── addressed to ──▶ Role + Party</pre><p class="callout">Berechtigungen nicht aus dem Firmennamen ableiten. Prüfe Rolle, Kontext und Gültigkeitszeitraum.</p>'}],quiz:[{question:'Wer verantwortet typischerweise die Messung?',options:['Lieferant','Messstellenbetreiber','Bilanzkreisverantwortlicher'],answer:1},{question:'Warum sind Organisation und Rolle getrennte Entitäten?',options:['Eine Organisation kann mehrere Rollen zeitabhängig ausüben','Rollen haben keine Identität','Organisationen ändern sich nie'],answer:0}],task:{title:'Entwirf eine Rollenbindung',prompt:'Welche Felder braucht eine zeitabhängige Rollenbindung?',answer:'<pre class="model">RoleAssignment { partyId, roleCode, marketArea, validFrom, validTo, identifier, source }</pre><p>Die Gültigkeit verhindert, dass heutige Rechte rückwirkend für alte Prozesse gelten.</p>'},sources:[['BDEW: Rollenmodell','https://www.bdew-mako.de/rollenmodell'],['Bundesnetzagentur: Datenformate','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/835_mitteilungen_datenformate/Datenformate-node.html']],prev:'01',next:'03'};</script><script src="app.js"></script></body></html>
