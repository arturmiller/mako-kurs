<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'07',minutes:13,title:'Lieferende und Auszug',lede:'Kundenauszug, Vertragsende, Zuordnungsende und Abrechnungsreife sind vier verschiedene Ereignisse.',objectives:['Auszug und Stilllegung unterscheiden','Zuordnungsende unabhängig vom Billing-Status modellieren','Korrekturen ohne Überschreiben verarbeiten'],chapters:[{title:'Ein Ende ist nicht genug',html:'<pre class="model">Customer move-out ─┐\nContract end       ├─ unterschiedliche Ursachen und Zeiten\nAssignment end     ┤\nBilling ready      ┘</pre><p>Eine MaLo wird durch Auszug nicht gelöscht. Ein Nachfolger, Grund-/Ersatzversorgung oder eine Klärung kann anschließen.</p>'},{title:'Rechnung folgt Datenreife',html:'<p>Auch nach bestätigtem Zuordnungsende können Messwert, Preis oder Netzdaten fehlen. Der Billing-Kontext wartet auf vollständige, gültige Eingaben.</p><p class="callout">Korrekturen als neue Version mit Quelle und Zeitbezug speichern – niemals die Vergangenheit unsichtbar überschreiben.</p>'}],quiz:[{question:'Bedeutet Kundenauszug automatisch Stilllegung der MaLo?',options:['Ja','Nein','Nur bei intelligentem Messsystem'],answer:1},{question:'Ist bestätigtes Zuordnungsende gleich „billing ready“?',options:['Ja','Nein, abrechnungsrelevante Daten können fehlen','Nur im Gasmarkt'],answer:1}],task:{title:'Trenne vier Aggregate',prompt:'Welche Kontexte reagieren auf einen Auszug?',answer:'<p><strong>Customer/Contract</strong> beendet das Vertragsverhältnis, <strong>Market Process</strong> koordiniert das Zuordnungsende, <strong>Metering</strong> liefert bzw. korrigiert Werte, <strong>Billing</strong> erstellt erst bei Datenreife die Schlussrechnung.</p>'},sources:[['Bundesnetzagentur: GPKE','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/831_gpke/gpke_basepage.html'],['Bundesnetzagentur: Grundversorgung','https://www.bundesnetzagentur.de/DE/Vportal/Energie/Vertragsarten/Grundversorgung/start.html']],prev:'06',next:'08'};</script><script src="app.js"></script></body></html>
