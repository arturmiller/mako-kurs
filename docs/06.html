<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'06',minutes:14,title:'Lieferantenwechsel ohne Umzug',lede:'Die Marktlokation bleibt; die zeitliche Lieferantenzuordnung wechselt.',objectives:['Lieferantenwechsel und Ein-/Auszug unterscheiden','überlappungsfreie Zuordnungsintervalle prüfen','24-Stunden-Prozess nicht mit 24-Stunden-Belieferungsstart verwechseln'],chapters:[{title:'Stabile Identität, wechselnde Verantwortung',html:'<p>Beim reinen Lieferantenwechsel bleiben Nutzer, Adresse und MaLo typischerweise bestehen. Alt- und Neulieferant besitzen angrenzende Zuordnungsintervalle.</p><pre class="model">Alt-LF: [2026-01-01, 2026-08-31]\nNeu-LF: [2026-09-01, …)</pre>'},{title:'Das 24h-Missverständnis',html:'<p>Der seit 06.06.2025 geltende beschleunigte werktägliche Lieferantenwechsel beschreibt die technische Abwicklung. Er bedeutet nicht, dass jeder Vertrag beliebig binnen 24 Stunden startet oder Kündigungsregeln verschwinden.</p><p class="callout">Speichere das angefragte, bestätigte und tatsächlich verwendete Datum getrennt.</p>'}],quiz:[{question:'Was bleibt beim Lieferantenwechsel ohne Umzug stabil?',options:['Die Lieferantenzuordnung','Die Marktlokation','Der Bilanzkreis in jedem Fall'],answer:1},{question:'Was bedeutet LFW24 fachlich nicht?',options:['Beschleunigte technische Abwicklung','Automatische Aufhebung vertraglicher Fristen','Werktäglicher Prozess'],answer:1}],task:{title:'Formuliere eine Invariante',prompt:'Welche Regel schützt vor Doppelbelieferung im Modell?',answer:'<p>Für dieselbe MaLo und denselben Zuordnungstyp dürfen sich bestätigte Lieferantenintervalle nicht überlappen. Gleichzeitig muss dein Modell Lücken sichtbar machen, statt sie stillschweigend zu schließen.</p>'},sources:[['Bundesnetzagentur: BK6-22-024','https://www.bundesnetzagentur.de/DE/Beschlusskammern/1_GZ/BK6-GZ/2022/BK6-22-024/BK6-22-024_Verfahren.html'],['Bundesnetzagentur: Mitteilung Nr. 4, Umsetzung 06.06.2025','https://www.bundesnetzagentur.de/DE/Beschlusskammern/1_GZ/BK6-GZ/2022/BK6-22-024/Mitteilung_Nr_04/Mitteilung_Nr_04.html']],prev:'05',next:'07'};</script><script src="app.js"></script></body></html>
