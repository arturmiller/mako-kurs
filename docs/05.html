<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'05',minutes:14,title:'Lieferbeginn beim Einzug',lede:'Ein Kundenvertrag wird nicht durch Speichern automatisch zu einer bestätigten Marktzuordnung.',objectives:['Vertrag, Prozess und Zuordnung getrennt führen','Bestätigung und Ablehnung als fachliche Ergebnisse behandeln','Startdatum und Systemzeit auseinanderhalten'],chapters:[{title:'Drei Wahrheiten',html:'<div class="flow"><div class="node">Vertrag<br><small>vereinbart</small></div><span class="arrow">→</span><div class="node">Prozess<br><small>beantragt</small></div><span class="arrow">→</span><div class="node">Zuordnung<br><small>bestätigt</small></div></div><p>Das CRM kennt eine Kundenabsicht. Die Marktkommunikation koordiniert sie. Erst das fachliche Ergebnis schafft eine bestätigte Zuordnung – möglicherweise mit Abweichung oder Ablehnung.</p>'},{title:'Zeit statt Boolean',html:'<pre class="model">SupplyStartProcess { requestedAt, requestedFrom, state }\nSupplierAssignment { marketLocationId, supplierId, validFrom, validTo, source }</pre><p class="callout"><code>isActive</code> verliert Zukunft, Historie und Korrekturen. Nutze Intervalle und fachliche Ereignisse.</p>'}],quiz:[{question:'Der Kunde unterschreibt. Ist die Marktzuordnung damit bestätigt?',options:['Ja, sofort','Nein, Vertrag und Marktzuordnung sind getrennt','Nur wenn die Rechnung existiert'],answer:1},{question:'Ist eine Ablehnung ein technischer Fehler?',options:['Immer','Nein, sie ist ein erwartbares fachliches Ergebnis','Sie darf nicht gespeichert werden'],answer:1}],task:{title:'Entwirf die Zustandsmaschine',prompt:'Nenne robuste Zustände für den Lieferbeginn.',answer:'<pre class="model">draft → requested → confirmed\n                 ↘ rejected → clarification → requested</pre><p>Technische Versandfehler liegen separat, damit fachlicher Zustand und Transportzustand nicht vermischt werden.</p>'},sources:[['Bundesnetzagentur: GPKE','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/831_gpke/gpke_basepage.html'],['Bundesnetzagentur: BK6-22-024','https://www.bundesnetzagentur.de/DE/Beschlusskammern/1_GZ/BK6-GZ/2022/BK6-22-024/BK6-22-024_Verfahren.html']],prev:'04',next:'06'};</script><script src="app.js"></script></body></html>
