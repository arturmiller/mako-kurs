<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'08',minutes:15,title:'Vom Messwert zur Energiemenge',lede:'Ein Wert wird erst durch Zeitbezug, Einheit, Qualität, Herkunft und Version fachlich belastbar.',objectives:['Zählerstand, Lastgang und Energiemenge unterscheiden','Messwertqualität und Ersatzwert kennzeichnen','Ableitungen reproduzierbar speichern'],chapters:[{title:'Wert ist nicht gleich Menge',html:'<p>Zwei Zählerstände ergeben durch Differenz eine Verbrauchsmenge. Ein Last- oder Zählerstandsgang liefert zeitbezogene Werte. Ersatz- und Korrekturwerte verändern den fachlichen Stand, ohne alte Versionen auszulöschen.</p><pre class="model">Reading { value, unit, timestamp, quality, source, version }\nQuantity { from, to, value, method, inputVersions[] }</pre>'},{title:'Provenienz als Feature',html:'<p>Eine Rechnung muss später erklären können, aus welchen Eingangswerten und welcher Berechnungsregel eine Menge entstand.</p><p class="callout">Idempotent verarbeiten: dieselbe Nachricht darf kein zweites fachliches Ergebnis erzeugen. Eine neue Version darf dagegen eine Neuberechnung auslösen.</p>'}],quiz:[{question:'Was fehlt der Zahl „4711“, damit sie ein brauchbarer Messwert wird?',options:['Nur eine Farbe','Zeit, Einheit, Qualität und Herkunft','Ein Kundenname reicht'],answer:1},{question:'Wie behandelst du eine Messwertkorrektur?',options:['Alten Wert löschen','Neue Version speichern und abhängige Ergebnisse neu bewerten','Ignorieren'],answer:1}],task:{title:'Baue die Herkunftskette',prompt:'Welche Referenzen braucht eine abgeleitete Energiemenge?',answer:'<p>Referenzen auf konkrete Versionen der Eingangswerte, die verwendete Berechnungsregel samt Version, den Ausführungszeitpunkt und einen fachlichen Status. Damit ist die Ableitung reproduzierbar und auditierbar.</p>'},sources:[['Bundesnetzagentur: WiM','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/833_wim/wim_basepage.html'],['Bundesnetzagentur: BK6-24-174 / Zählerstandsgänge','https://www.bundesnetzagentur.de/DE/Beschlusskammern/1_GZ/BK6-GZ/2024/BK6-24-174/BK6-24-174_verfahren.html']],prev:'07',next:'09'};</script><script src="app.js"></script></body></html>
