<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'09',minutes:15,title:'Vom Tarif zur Rechnung',lede:'Billing ist die nachvollziehbare Bewertung von Mengen und Zeitanteilen mit versionierten Regeln.',objectives:['Arbeits- und Grundpreis unterschiedlich berechnen','Abrechnungszeiträume an Regeländerungen segmentieren','Rechnungsergebnis und Berechnungsnachweis trennen'],chapters:[{title:'Zeit schneidet die Rechnung',html:'<p>Beginnt die Belieferung am 10. Februar, ändert sich der Arbeitspreis am 15. April und die Steuerregel am 1. Juli, entstehen mindestens drei Segmente. Jedes Segment nutzt die dort gültigen Mengen und Regeln.</p><pre class="model">Segment = Schnittmenge aus\nLieferzeit × Tarifgültigkeit × Steuerregel × Messdatenlage</pre>'},{title:'Bewerten statt raten',html:'<p>Arbeitspreis bewertet Energie (z. B. kWh). Ein Grundpreis benötigt eine explizite Proratisierungsregel. Rundung, Steuer und Preisbestandteile müssen versioniert und in definierter Reihenfolge angewendet werden.</p><p class="callout">Geld immer als Dezimalwert plus Währung modellieren; Rundung ist eine fachliche Regel.</p>'}],quiz:[{question:'Wie viele Segmente entstehen bei Lieferbeginn plus zwei Regelwechseln mindestens?',options:['Eins','Zwei','Drei'],answer:2},{question:'Was benötigt ein unterjähriger Grundpreis?',options:['Eine definierte Proratisierungsregel','Immer eine kWh-Menge','Eine Zählernummer als Preis'],answer:0}],task:{title:'Entwirf den Calculation Trace',prompt:'Wie erklärst du einen Rechnungsbetrag später revisionssicher?',answer:'<pre class="model">InvoiceLine\n ├─ period + quantityVersion\n ├─ priceRuleVersion + taxRuleVersion\n ├─ operands + intermediateResults\n └─ roundingRule + finalAmount</pre><p>Der Trace ist unveränderlich; eine Korrektur erzeugt eine neue Rechnung bzw. Version statt stiller Mutation.</p>'},sources:[['Bundesnetzagentur: Stromrechnung verstehen','https://www.bundesnetzagentur.de/DE/Vportal/Energie/RechnungenSperrungen/Rechnungen-table.html'],['Bundesnetzagentur: Netzentgelte','https://www.bundesnetzagentur.de/DE/Fachthemen/ElektrizitaetundGas/Netzentgelte/start.html']],prev:'08',next:'10'};</script><script src="app.js"></script></body></html>
