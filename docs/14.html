<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'14',minutes:40,title:'Stammdatenänderungen und Zeitbezug',lede:'Marktdaten haben mindestens zwei Zeiten: wann etwas fachlich galt und wann das System davon wusste.',objectives:['fachliche Gültigkeit und Systemwissen unterscheiden','Zuordnungen und Konfigurationen temporal modellieren','rückwirkende Korrekturen ohne Überschreiben verarbeiten','historische Entscheidungen reproduzieren'],chapters:[{title:'Warum ein Zeitstempel nicht reicht',html:'<p>Eine Lieferantenzuordnung kann ab dem ersten Juli gelten, aber erst am dritten Juli im System eintreffen. Eine Korrektur kann im August bekannt werden und rückwirkend den Juli betreffen. Ein Feld updatedAt beantwortet weder, was fachlich am ersten Juli galt, noch welche Information dem System am zweiten Juli vorlag.</p><p>Darum unterscheiden wir Gültigkeitszeit und Wissenszeit. Gültig ab und gültig bis beschreiben die fachliche Welt. Bekannt seit und gegebenenfalls bekannt bis beschreiben die im System vorhandene Version. Verarbeitet am ist ein technischer Zeitstempel und ersetzt keine der beiden Achsen.</p>'},{title:'Bitemporales Modell',html:'<pre class="model">TemporalFact {\n  subject, value,\n  validFrom, validTo,\n  knownFrom, knownTo,\n  source, correctionOf\n}</pre><p>Mit zwei Zeitachsen kann das System zwei verschiedene Fragen beantworten. Was gilt fachlich für den fünfzehnten Juli nach heutigem Kenntnisstand? Und was glaubte das System am sechzehnten Juli über den fünfzehnten Juli? Die zweite Frage ist für Revision und Fehleranalyse entscheidend.</p><p>Eine Korrektur beendet die Wissensgültigkeit der alten Version und ergänzt eine neue. Die alte Aussage bleibt erhalten. Fachliche Intervalle können dabei geteilt, verkürzt oder ersetzt werden.</p>'},{title:'Welche Daten zeitabhängig sind',html:'<p>MaLo- und MeLo-Beziehungen, Lieferanten- und Bilanzkreiszuordnungen, Messverfahren, Profile, Prognosegrundlagen und Marktpartnerrollen besitzen Gültigkeitszeiträume. Auch Preise und Vertragsbedingungen sind versionierte Regeln. Unterschiedliche Objekte dürfen sich ändern, ohne dass die Identität der Marktlokation verloren geht.</p><p>Das Modell braucht Invarianten pro Faktentyp. Bestätigte Lieferantenzuordnungen derselben Art dürfen sich für eine MaLo nicht unzulässig überlappen. Ein Messverfahren kann nur verwendet werden, wenn die zugehörige Konfiguration im betreffenden Zeitraum gültig war.</p>'},{title:'Rückwirkung und abhängige Ergebnisse',html:'<p>Eine rückwirkende Stammdatenkorrektur kann Messwertadressierung, Bilanzkreisaggregation, Netznutzungsprüfung und Billing beeinflussen. Deshalb veröffentlicht das Stammdatenmodell ein fachliches Korrekturereignis mit betroffenem Zeitraum. Abhängige Kontexte entscheiden anhand ihrer Provenienz, welche Ergebnisse veraltet sind.</p><p>Neuberechnung bedeutet nicht, alles pauschal neu zu rechnen. Ein Abhängigkeitsgraph grenzt betroffene Ergebnisse ein. Alte Ergebnisse werden als überholt markiert; neue Versionen referenzieren die korrigierten Eingaben.</p>'}],quiz:[{question:'Was beschreibt validFrom?',options:['Den fachlichen Beginn der Gültigkeit','Nur den Empfangszeitpunkt','Den Dateinamen'],answer:0},{question:'Was beantwortet knownFrom?',options:['Seit wann das System diese Version kannte','Wann Strom physisch floss','Wann eine Rechnung bezahlt wurde'],answer:0},{question:'Wie wird eine Rückwirkung gespeichert?',options:['Alte Daten löschen','Neue Version mit eigener Wissenszeit und Herkunft','updatedAt überschreiben'],answer:1}],task:{title:'Rekonstruiere Wissen und Geltung',prompt:'Eine Zuordnung gilt ab 1. Juli, trifft am 3. Juli ein und wird am 10. August rückwirkend korrigiert.',answer:'<p>Speichere die erste Version mit fachlicher Gültigkeit ab 1. Juli und Wissensbeginn 3. Juli. Beende ihre Wissensgültigkeit am 10. August. Die Korrektur erhält Wissensbeginn 10. August und den korrigierten fachlichen Zeitraum. Damit bleiben damalige und heutige Sicht abfragbar.</p>'},sources:[['Bundesnetzagentur: GPKE','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/831_gpke/gpke_basepage.html'],['Bundesnetzagentur: WiM','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/833_wim/wim_basepage.html']],prev:'13',next:'15'};</script><script src="app.js"></script></body></html>
