<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'19',minutes:50,title:'Revisionssichere Gesamtarchitektur',lede:'Der Abschluss verbindet Vertrag, Marktkommunikation, Messung, Billing, Zahlungen und Bilanzierung zu einem System, das seine Ergebnisse Jahre später noch erklären kann.',objectives:['Domänengrenzen und Verantwortlichkeiten festlegen','Prozesse eventbasiert über Grenzen koordinieren','Storno und Versionierung konsequent anwenden','einen vollständigen Audit-Trail entwerfen'],chapters:[{title:'Domänen mit klarer Verantwortung',html:'<p>Vertragsverwaltung verantwortet Angebot, Vertrag, Laufzeit und Kündigung. Marktkommunikation koordiniert externe Prozesse und Nachrichten. Metering verwaltet Messobjekte, Beobachtungen und Energiemengen. Rating und Billing bewerten Mengen. Debitoren und Kreditoren führen Forderungen, Eingangsrechnungen und Zahlungen. Bilanzierung erzeugt und aggregiert Zeitreihen.</p><p>Jede Domäne besitzt eigene Begriffe und Invarianten. Eine gemeinsame Mega-Tabelle für Kunde, MaLo, Zähler, Vertrag, Rechnung und Bilanzkreis koppelt Lebenszyklen, die unabhängig voneinander sind. Grenzen werden durch fachliche Ereignisse und explizite APIs verbunden.</p>'},{title:'Events, Prozessengine und Sagas',html:'<p>Ein Event beschreibt eine eingetretene fachliche Tatsache, etwa SupplierAssignmentConfirmed oder MeterReadingCorrected. Andere Kontexte reagieren darauf und erzeugen eigene Ergebnisse. Events ersetzen nicht jede direkte Abfrage, schaffen aber eine stabile Integrationssprache und dokumentieren den Ablauf.</p><p>Lange Prozesse wie Lieferbeginn oder Korrekturabrechnung benötigen Fristen, Wiederholungen und Kompensation. Eine Prozessengine hält den technischen Ablauf. Eine Saga koordiniert Schritte über Domänengrenzen, ohne deren Datenbanken zu übernehmen. Fachzustand und Orchestrierungszustand bleiben getrennt.</p><pre class="model">ContractSigned\nSupplyStartRequested\nSupplierAssignmentConfirmed\nMeterReadingAccepted\nInvoiceIssued\nPaymentAllocated\nMeterReadingCorrected\nInvoiceReversed\nCorrectedInvoiceIssued\nBalanceTimeSeriesRecalculated</pre>'},{title:'Storno, Audit und Reproduzierbarkeit',html:'<p>Geschäftlich relevante Belege und Ergebnisse werden nicht überschrieben. Ein Storno neutralisiert die Wirkung eines Belegs und referenziert ihn. Eine Neuabrechnung verwendet neue Eingabeversionen. Der Audit-Trail verbindet Benutzer oder System, Zeitpunkt, Ursache, Quelle und betroffene Objekte.</p><p>GoBD, Handelsgesetzbuch und Abgabenordnung stellen Anforderungen an Nachvollziehbarkeit, Vollständigkeit und Aufbewahrung steuerlich relevanter Unterlagen. Datenschutzrecht verlangt zugleich Zweckbindung, Zugriffsschutz und Löschkonzepte. Revisionssicherheit bedeutet daher nicht, beliebige personenbezogene Daten unbegrenzt zu speichern, sondern gesetzliche Pflichten und Datenschutz kontrolliert zusammenzuführen.</p>'},{title:'Der vollständige Kundenfall',html:'<p>Ein Kunde schließt einen Vertrag. Der Lieferbeginn wird marktlich beantragt und bestätigt. Die Zuordnung verbindet MaLo, Lieferant und Bilanzkreis. Messwerte werden empfangen, geprüft und zu Energiemengen verarbeitet. Billing erzeugt die Kundenrechnung. Parallel prüft der Lieferant die Netznutzungsrechnung. Zahlungseingänge werden Forderungen zugeordnet.</p><p>Später korrigiert der Messstellenbetreiber einen Wert. Der Dependency Resolver findet betroffene Energiemengen, Kundenrechnung, Netznutzungsprüfung und Bilanzkreiszeitreihe. Die alte Rechnung wird storniert, eine neue erzeugt und der Kundensaldo angepasst. Die Bilanzierung erhält eine neue Zeitreihenversion. Kein Schritt löscht die frühere Sicht.</p><p>Jahre später kann das System die zentrale Frage beantworten: Welche fachlichen Fakten waren gültig, welche Versionen waren bekannt, welche Regeln wurden ausgeführt, wer löste den Prozess aus und welche Belege neutralisierten frühere Ergebnisse?</p>'},{title:'Architekturbeweis statt Architekturdiagramm',html:'<p>Eine revisionssichere Architektur beweist ihre Eigenschaften durch Tests. Contract Tests sichern Nachrichtenadapter. Temporale Tests prüfen Rückwirkungen. Property Tests sichern Geld- und Mengeninvarianten. Replay Tests rekonstruieren Ergebnisse aus Ereignissen und Versionen. Berechtigungstests schützen personenbezogene und finanzielle Daten.</p><p>Das Ziel ist nicht maximale technische Komplexität. Das Ziel ist eine klare Kette von der Quelle bis zum Ergebnis. Jede Abstraktion muss helfen, diese Kette zu verstehen, zu verändern oder zu prüfen.</p>'}],quiz:[{question:'Wer verantwortet Messwertversionen?',options:['Metering-Domäne','Vertragsverwaltung','Mahnwesen'],answer:0},{question:'Was macht ein Storno?',options:['Es löscht die Historie','Es neutralisiert nachvollziehbar die Wirkung eines Belegs','Es ändert den Zähler'],answer:1},{question:'Was muss ein Ergebnis reproduzierbar machen?',options:['Eingabe- und Regelversionen','Nur der aktuelle Saldo','Ein Screenshot'],answer:0}],task:{title:'Führe den Abschlussfall durch',prompt:'Skizziere Aggregate und Events vom Vertrag bis zur korrigierten Bilanzierung.',answer:'<p>Nutze getrennte Aggregate für Vertrag, Zuordnungsprozess, Messwert, Energiemenge, Rechnung, Forderung, Netznutzungsbeleg und Bilanzzeitreihe. Verbinde sie über unveränderliche IDs und fachliche Events. Jede Ableitung referenziert konkrete Eingabeversionen. Korrektur, Storno und Neuberechnung erzeugen neue Fakten statt Mutation.</p>'},sources:[['Abgabenordnung','https://www.gesetze-im-internet.de/ao_1977/'],['Handelsgesetzbuch','https://www.gesetze-im-internet.de/hgb/'],['Datenschutz-Grundverordnung','https://eur-lex.europa.eu/eli/reg/2016/679/oj?locale=de'],['Bundesfinanzministerium: GoBD','https://www.bundesfinanzministerium.de/Content/DE/Downloads/BMF_Schreiben/Weitere_Steuerthemen/Abgabenordnung/2024-03-11-aenderung-gobd.html']],prev:'18'};</script><script src="app.js"></script></body></html>
