<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'03',minutes:14,title:'MaLo, MeLo und Zähler',lede:'Adresse, Verbrauchsstelle, Messung und Gerät sind verschiedene Identitäten mit verschiedenen Lebenszyklen.',objectives:['Marktlokation, Messlokation und Messgerät trennen','einen Zählerwechsel ohne Identitätsverlust modellieren','fachliche Beziehungen zeitlich versionieren'],chapters:[{title:'Was wird beliefert, was wird gemessen?',html:'<p>Die <strong>Marktlokation (MaLo)</strong> beschreibt Erzeugung oder Verbrauch als Marktobjekt. Die <strong>Messlokation (MeLo)</strong> beschreibt den Ort der Messung. Das <strong>Messgerät</strong> ist das technische Gerät. Eine Postadresse identifiziert keines davon eindeutig.</p><div class="flow"><div class="node">Adresse</div><span class="arrow">≠</span><div class="node">MaLo</div><span class="arrow">↔</span><div class="node">MeLo</div><span class="arrow">↔</span><div class="node">Zähler</div></div>'},{title:'Lebenszyklen entkoppeln',html:'<p>Ein defekter Zähler kann ersetzt werden, während MaLo und Lieferverhältnis bestehen bleiben. Deshalb gehört die Gerätenummer nicht als Primärschlüssel an Vertrag oder Rechnung.</p><pre class="model">MarketLocation\n  └─ MeteringRelation [validFrom, validTo]\n       └─ MeterDeviceInstallation [validFrom, validTo]</pre>'}],quiz:[{question:'Ein Zähler wird ausgetauscht. Was bleibt typischerweise stabil?',options:['Die Gerätenummer','Die Marktlokation','Jeder Messwert'],answer:1},{question:'Kann eine Adresse allein die Verbrauchsstelle eindeutig bestimmen?',options:['Immer','Nein, dort können mehrere Marktobjekte liegen','Nur bei Strom'],answer:1}],task:{title:'Modelliere den Zählerwechsel',prompt:'Wie bewahrst du Historie und ordnest Werte korrekt zu?',answer:'<p>Beende die alte <code>MeterDeviceInstallation</code> zum Ausbauzeitpunkt und beginne eine neue. Messwerte referenzieren Installation oder Messlokation plus Zeitraum; die MaLo bleibt über die zeitgültige Messbeziehung erreichbar.</p>'},sources:[['Bundesnetzagentur: GPKE, aktuell gültige Fassung','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/831_gpke/gpke_basepage.html'],['Bundesnetzagentur: WiM','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/833_wim/wim_basepage.html']],prev:'02',next:'04'};</script><script src="app.js"></script></body></html>
