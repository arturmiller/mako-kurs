<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'11',minutes:35,title:'Zahlungen, Forderungen und Mahnwesen',lede:'Eine Rechnung begründet eine Forderung. Erst Zahlungen, Verrechnungen, Rücklastschriften und Vereinbarungen zeigen, welcher Betrag tatsächlich offen ist.',objectives:['Forderung, offenen Posten und Zahlung trennen','Zahlungen nachvollziehbar auf Belege zuordnen','Storno, Rücklastschrift und Ratenplan ohne Überschreiben modellieren','Mahnstatus aus dem aktuellen Forderungsstand ableiten'],chapters:[{title:'Die Forderung ist kein Saldo-Feld',html:'<p>Eine freigegebene Kundenrechnung erzeugt eine Forderung mit Betrag, Fälligkeit und Schuldner. Der offene Posten ist die noch nicht ausgeglichene Sicht auf diese Forderung. Er verändert sich durch Zahlungszuordnungen, Gutschriften, Storno, Ausbuchungen oder Rückbuchungen. Ein einzelnes Feld openAmount ohne Herkunftskette kann diese Entwicklung nicht erklären.</p><p>Robust ist ein Nebenbuchmodell: Rechnungsbelege und Zahlungen bleiben unverändert. Zuordnungen verbinden Teilbeträge. Der offene Betrag wird aus wirksamen Buchungen berechnet. Dadurch kann eine Zahlung mehrere Rechnungen ausgleichen oder eine Rechnung durch mehrere Zahlungen beglichen werden.</p>'},{title:'Vom Abschlag zur Schlussrechnung',html:'<p>Abschläge sind vorausgeplante Zahlungen auf eine spätere Abrechnung. Die Schluss- oder Jahresrechnung stellt den tatsächlichen Rechnungsbetrag den bereits geleisteten Abschlägen gegenüber. Dabei muss sichtbar bleiben, welcher Abschlag gefordert, bezahlt, zurückgebucht oder noch offen war.</p><p>Eine SEPA-Lastschrift erzeugt nicht sofort einen endgültigen Zahlungserfolg. Zwischen Einreichung, Bankbestätigung und möglicher Rücklastschrift liegen verschiedene Ereignisse. Bei einer Rücklastschrift wird die ursprüngliche Zahlung nicht gelöscht. Eine Gegenbuchung hebt ihre wirtschaftliche Wirkung auf und dokumentiert Gebühren sowie Rückgabegrund.</p><pre class="model">Receivable { documentId, amount, dueDate }\nPayment { bankReference, valueDate, amount }\nAllocation { paymentId, receivableId, allocatedAmount }\nReversal { reversesEntryId, reason, effectiveDate }</pre>'},{title:'Überzahlung, Unterzahlung und Raten',html:'<p>Bei Unterzahlung bleibt ein Rest offen. Bei Überzahlung entsteht ein Kundenguthaben, das erst durch Verrechnung oder Auszahlung verwendet wird. Unklare Zahlungseingänge gehören auf ein Klärungskonto, bis ein belastbarer Zuordnungsschlüssel gefunden wurde. Eine automatische Zuordnung sollte immer Regel, Trefferqualität und manuelle Korrektur protokollieren.</p><p>Eine Ratenzahlungsvereinbarung ändert die Zahlungsplanung, nicht die historische Rechnung. Sie erzeugt neue Fälligkeiten und kann den Mahnlauf aussetzen. Wird eine Rate nicht bezahlt, entscheidet eine versionierte Regel, ob der Plan fortbesteht, gekündigt oder neu verhandelt wird.</p>'},{title:'Mahnwesen als Prozess',html:'<p>Ein Mahnlauf prüft fällige, nicht ausgesetzte Forderungen. Mahnstufen, Gebühren, Fristen und Kommunikationskanäle sind Regeln mit Gültigkeitszeitraum. Inkasso oder ein Sperrprozess sind nachgelagerte Prozesse mit eigenen rechtlichen Voraussetzungen und dürfen nicht als bloße nächste Zahl im Mahnstatus modelliert werden.</p><p>Jede Entscheidung braucht einen Snapshot der verwendeten Fakten: offener Betrag, Fälligkeit, Sperrkennzeichen, laufende Klärung, Ratenplan und Regelversion. So bleibt nachvollziehbar, warum ein Kunde an einem bestimmten Tag gemahnt oder gerade nicht gemahnt wurde.</p>'}],quiz:[{question:'Was ist ein offener Posten?',options:['Die unveränderliche Rechnung selbst','Der noch nicht ausgeglichene Teil einer Forderung','Eine Zählernummer'],answer:1},{question:'Wie wird eine Rücklastschrift robust gespeichert?',options:['Die Zahlung wird gelöscht','Als Gegenbuchung zur ursprünglichen Zahlung','Nur als Freitext'],answer:1},{question:'Was verändert ein Ratenplan primär?',options:['Die historische Rechnungsposition','Die Fälligkeiten und Zahlungsplanung','Den Messwert'],answer:1}],task:{title:'Rekonstruiere einen Forderungsverlauf',prompt:'Eine Rechnung über 240 Euro erhält 100 Euro Zahlung, danach eine Rücklastschrift und später drei Raten.',answer:'<p>Lege Rechnung, Zahlung und Rücklastschrift als getrennte Buchungen an. Die Rücklastschrift referenziert die Zahlung und stellt deren Wirkung zurück. Der Ratenplan definiert neue geplante Fälligkeiten; jede tatsächliche Rate wird als neue Zahlung mit eigener Zuordnung gespeichert. Der offene Betrag ist jederzeit aus diesen Einträgen ableitbar.</p>'},sources:[['Bürgerliches Gesetzbuch','https://www.gesetze-im-internet.de/bgb/'],['Bundesnetzagentur: Rechnungen und Sperrungen','https://www.bundesnetzagentur.de/DE/Vportal/Energie/RechnungenSperrungen/Rechnungen-table.html']],prev:'10',next:'12'};</script><script src="app.js"></script></body></html>
