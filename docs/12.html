<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'12',minutes:40,title:'Aufbau einer Marktkommunikationsnachricht',lede:'EDIFACT ist die standardisierte Verpackung fachlicher Aussagen. Wer die Hierarchie versteht, kann eine Nachricht lesen, validieren und in Domänenobjekte übersetzen.',objectives:['Interchange, Nachricht, Segment und Datenelement unterscheiden','UNB, UNH und UNT einordnen','Qualifier als Bedeutungsgeber lesen','MIG und Anwendungshandbuch gemeinsam verwenden'],chapters:[{title:'Von außen nach innen',html:'<p>Ein Interchange ist der technische Umschlag zwischen Absender und Empfänger. Darin können Nachrichten liegen. Eine Nachricht enthält Segmente, Segmente enthalten einfache oder zusammengesetzte Datenelemente. Trennzeichen strukturieren die Zeichenfolge, tragen aber selbst keine fachliche Bedeutung.</p><p>UNB eröffnet den Interchange und enthält unter anderem Kommunikationspartner und Referenz. UNH eröffnet eine einzelne Nachricht und identifiziert Nachrichtentyp sowie Version. UNT beendet die Nachricht und enthält Kontrollinformationen wie Segmentanzahl und Nachrichtenreferenz. Diese Hüllinformationen helfen bei Adressierung, Korrelation und Vollständigkeitsprüfung.</p><pre class="model">Interchange\n  UNB: Absender, Empfänger, Interchange-Referenz\n  Nachricht\n    UNH: Nachrichtenreferenz und Typ\n    Fachsegmente: Stammdaten, Zeiträume, Identifikatoren\n    UNT: Segmentanzahl und Referenz\n  UNZ: Abschluss des Interchange</pre>'},{title:'Segmente, Elemente und Qualifier',html:'<p>Ein Segment bündelt zusammengehörige Angaben. Ein Datenelement enthält einen Wert. Ein Qualifier erklärt, welche Bedeutung ein benachbartes Element in diesem Kontext besitzt. Dieselbe Segmentstruktur kann dadurch unterschiedliche fachliche Aussagen transportieren.</p><p>Deshalb reicht es nicht, Werte nur nach Position einzulesen. Der Parser erzeugt zunächst ein syntaktisches Modell. Danach interpretiert ein fachlicher Mapper Segment, Qualifier, Prozesskontext und Version gemeinsam. Eine Marktlokations-ID, Messlokations-ID oder Transaktionsreferenz muss in das passende Domänenfeld gelangen und darf nicht nur als beliebige Zeichenfolge gespeichert werden.</p>'},{title:'MIG und Anwendungshandbuch',html:'<p>Die Message Implementation Guideline beschreibt die zulässige technische Struktur eines Nachrichtentyps. Das Anwendungshandbuch konkretisiert die Nutzung für die energiewirtschaftlichen Anwendungsfälle. Erst beide zusammen beantworten, welche Segmente und Qualifier in einem bestimmten Prozess erwartet werden.</p><p>Pflichtfelder müssen vorhanden sein. Kann-Felder dürfen vorkommen. Bedingte Felder werden durch fachliche Situationen verpflichtend. Diese Bedingung gehört als explizite Validierungsregel ins System. Sie darf nicht in verstreuten if-Anweisungen verschwinden, weil Nachrichtenversionen und Anwendungsfälle sich ändern.</p>'},{title:'Vom Vorgang zur Nachricht',html:'<p>Am Anfang steht kein Segment, sondern eine fachliche Absicht, zum Beispiel die Anmeldung eines Lieferbeginns. Ein Prozessmodell bestimmt benötigte Rollen, Marktobjekte, Termine und Referenzen. Ein versionsgebundener Mapper erzeugt daraus das Nachrichtenmodell. Der Serializer schreibt anschließend die EDIFACT-Zeichenfolge.</p><p>Beim Eingang läuft die Richtung umgekehrt. Syntaxprüfung, versionsabhängige Strukturprüfung und fachliche Validierung sind getrennte Stufen. Der Domänenkern sollte nicht wissen, an welcher Segmentposition eine MaLo-ID stand.</p>'}],quiz:[{question:'Was eröffnet eine einzelne EDIFACT-Nachricht?',options:['UNH','UNT','REMADV'],answer:0},{question:'Welche Aufgabe hat ein Qualifier?',options:['Er verleiht einem Wert kontextbezogene Bedeutung','Er verschlüsselt die Datei','Er bezahlt die Rechnung'],answer:0},{question:'Warum werden MIG und AHB gemeinsam benötigt?',options:['Sie sind identisch','Sie verbinden technische Struktur und fachliche Verwendung','Nur das Dateiformat zählt'],answer:1}],task:{title:'Zerlege eine Nachricht gedanklich',prompt:'Ordne Absender, MaLo-ID, Prozessdatum und Transaktionsreferenz den richtigen Ebenen zu.',answer:'<p>Absender und Empfänger gehören zur Interchange- beziehungsweise Nachrichtenadressierung. MaLo-ID und Prozessdatum sind fachliche Nutzdaten. Die Transaktionsreferenz korreliert den konkreten Prozessvorgang. Parser und Mapper bewahren diese Unterschiede, auch wenn alles als Zeichenfolge übertragen wird.</p>'},sources:[['Bundesnetzagentur: Datenformate der Marktkommunikation','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/835_mitteilungen_datenformate/Datenformate-node.html'],['BDEW MaKo: EDI@Energy-Dokumente','https://www.bdew-mako.de/']],prev:'11',next:'13'};</script><script src="app.js"></script></body></html>
