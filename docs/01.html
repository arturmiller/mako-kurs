<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'01',minutes:25,title:'Warum gibt es Marktkommunikation?',lede:'Bevor wir Nachrichtenformate betrachten, müssen wir verstehen, welches Problem der liberalisierte Strommarkt überhaupt lösen muss.',objectives:['physischen Stromfluss und Informationsfluss unterscheiden','erklären, weshalb unabhängige Marktrollen dieselben Tatsachen koordinieren müssen','Marktnachrichten als Transport fachlicher Aussagen behandeln','die erste sinnvolle Systemgrenze für ein EVU-System ziehen'],chapters:[{kicker:'Ausgangssituation',title:'Eine Welt ohne Marktkommunikation',html:'<p>Stell dir ein regionales Energieunternehmen im Jahr 1985 vor. Es betreibt Kraftwerke, Leitungen und Zähler, beschäftigt den Kundenservice und schreibt die Rechnung. Herr Müller zieht in eine Wohnung und ruft dort an. Für das Unternehmen ist der Vorgang einfach: Eine Organisation kontrolliert fast die gesamte Informationskette.</p><p>Wenn der Zählerstand fehlt, fragt die Rechnungsabteilung intern nach. Wenn eine Adresse unklar ist, kennt der Netzbereich die örtliche Situation. Es gibt Schnittstellen, aber die Beteiligten arbeiten unter derselben organisatorischen Verantwortung. Viele Bedeutungen können informell geklärt werden.</p><p class="callout"><strong>Wichtige Erkenntnis:</strong> Der Strommarkt brauchte nicht deshalb standardisierte Marktkommunikation, weil Strom plötzlich anders fließt. Er brauchte sie, weil Verantwortung über Unternehmensgrenzen verteilt wurde.</p>'},{kicker:'Liberalisierter Markt',title:'Der Stromfluss bleibt – die Verantwortung wird verteilt',html:'<p>Heute kann Herr Müller seinen Lieferanten wählen. Der örtliche Netzbetreiber bleibt für das Verteilnetz zuständig. Ein Messstellenbetreiber verantwortet die Messung. Energiemengen werden Bilanzkreisen zugeordnet. Diese Rollen können von verschiedenen Unternehmen wahrgenommen werden – und jedes Unternehmen besitzt nur einen Ausschnitt der Wahrheit.</p><div class="flow"><div class="node">Kunde<br><small>Vertrag &amp; Nutzung</small></div><span class="arrow">↔</span><div class="node">Lieferant<br><small>Belieferung</small></div><span class="arrow">↔</span><div class="node">Netzbetreiber<br><small>Zuordnung</small></div><span class="arrow">↔</span><div class="node">Messstellenbetreiber<br><small>Messung</small></div></div><p>Der Lieferant weiß etwa, welchen Vertrag der Kunde abgeschlossen hat. Der Netzbetreiber weiß, welche Marktlokation im Netz existiert und welcher Lieferant ihr für einen Zeitraum zugeordnet ist. Der Messstellenbetreiber kennt Messgerät, Messlokation und Werte. Keine Rolle darf einfach voraussetzen, dass ihre interne Sicht automatisch bei allen anderen gilt.</p>'},{kicker:'Zwei Ebenen',title:'Energiefluss ist nicht Informationsfluss',html:'<p><strong>Der Energiefluss</strong> beschreibt die physische Welt: Erzeugung speist Energie ein, Netze transportieren sie und Verbraucher entnehmen sie. Der einzelne Elektron trägt dabei weder Kundennummer noch Lieferantenkennzeichen.</p><p><strong>Der Informationsfluss</strong> beschreibt die Marktorganisation: Wer beliefert welche Marktlokation in welchem Zeitraum? Wer darf Messwerte erhalten? Welchem Bilanzkreis wird die Menge zugerechnet? Welche Daten dürfen in eine Rechnung eingehen?</p><p>Beide Ebenen hängen zusammen, dürfen im System aber nicht verwechselt werden. Ein bestätigter Lieferbeginn schaltet nicht physisch den Stromfluss ein. Umgekehrt beweist physischer Verbrauch nicht, dass der gewünschte Liefervertrag bereits marktlich zugeordnet ist.</p><pre class="model">Physik:       Erzeugung → Netz → Entnahme\nMarktmodell:  Rolle → Zuordnung → Zeitraum → Energiemenge\nKommunikation: Aussage → Nachricht → Prüfung → fachliches Ergebnis</pre>'},{kicker:'Softwareperspektive',title:'Eine Nachricht ist nicht die Wahrheit selbst',html:'<p>EDIFACT-Nachrichten oder künftige APIs sind Transportformen. Sie übermitteln Aussagen über fachliche Tatsachen. Wenn dein Kernmodell ausschließlich aus Nachrichtensegmenten besteht, vermischst du Transport, Prozess und Domäne. Ein Formatwechsel wird dann zum Umbau des gesamten Systems.</p><p>Robuster ist eine Übersetzung an der Systemgrenze: Ein Adapter prüft Syntax und technische Adressierung. Danach wird aus der Nachricht ein fachlicher Befehl oder ein beobachtetes Ereignis. Die Domäne entscheidet anhand ihrer Regeln, ob daraus etwa eine bestätigte Lieferantenzuordnung entsteht.</p><pre class="model">UTILMD / API-Payload\n       ↓ Adapter\nRequestSupplierAssignment\n       ↓ Domänenregel\nSupplierAssignmentConfirmed | Rejected</pre><p class="callout">Speichere neben der fachlichen Tatsache immer Herkunft, Gültigkeitszeitraum und Prozessbezug. Dann bleibt nachvollziehbar, warum das System etwas glaubt.</p>'}],quiz:[{question:'Warum entstand standardisierte Marktkommunikation?',options:['Weil Strom seit der Liberalisierung digital fließt','Weil getrennte Marktrollen gemeinsame fachliche Tatsachen koordinieren müssen','Weil jeder Zähler direkt Rechnungen versendet'],answer:1},{question:'Herr Müller verbraucht bereits Strom. Was beweist das allein?',options:['Sein Wunschlieferant ist bestätigt','Es findet eine physische Entnahme statt, aber die Marktzuordnung ist damit nicht bewiesen','Seine Rechnung ist vollständig'],answer:1},{question:'Was sollte der Domänenkern primär speichern?',options:['Nur rohe EDIFACT-Dateien','Fachliche Tatsachen mit Herkunft und zeitlicher Gültigkeit','Nur den letzten Prozessstatus'],answer:1}],task:{title:'Ziehe die erste Systemgrenze',prompt:'Skizziere für einen Lieferbeginn die fachliche Aussage, den Transport und das mögliche Ergebnis getrennt.',answer:'<p><strong>Aussage:</strong> Lieferant L möchte MaLo M ab Datum T beliefern. <strong>Transport:</strong> eine gültige Marktnachricht bzw. später ein API-Aufruf. <strong>Ergebnis:</strong> Der Netzbetreiber bestätigt die Zuordnung, lehnt sie mit Grund ab oder fordert Klärung. Im Kernmodell werden Antrag und Ergebnis getrennt gespeichert.</p><p>Wenn dir eine Trennung noch unklar ist, frage den Agenten mit deinem konkreten Domänenmodell – er ist dein Sparringspartner für den Kurs.</p>'},sources:[['EnWG – Gesetz über die Elektrizitäts- und Gasversorgung','https://www.gesetze-im-internet.de/enwg_2005/'],['Bundesnetzagentur: aktuell gültige GPKE','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/831_gpke/gpke_basepage.html']],next:'02'};</script><script src="app.js"></script></body></html>
