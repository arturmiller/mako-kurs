<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'01',minutes:12,title:'Warum gibt es Marktkommunikation?',lede:'Der Strom fließt wie früher. Neu ist, dass Verantwortung über Unternehmensgrenzen hinweg koordiniert werden muss.',objectives:['physischen Stromfluss und Informationsfluss unterscheiden','erklären, weshalb liberalisierte Märkte standardisierte Kommunikation brauchen','eine Markt-Nachricht als Beleg einer fachlichen Tatsache behandeln'],chapters:[{title:'Vom Monolithen zum verteilten System',html:'<p>Im integrierten Versorger lagen Netz, Messung, Lieferung und Abrechnung in einer Organisation. Wettbewerb trennt diese Verantwortungen. Physikalisch bleibt das Netz gekoppelt; organisatorisch entsteht ein verteiltes System.</p><div class="flow"><div class="node">Kunde</div><span class="arrow">→</span><div class="node">Lieferant</div><span class="arrow">↔</span><div class="node">Netzbetreiber</div><span class="arrow">↔</span><div class="node">Messstellenbetreiber</div></div>'},{title:'Zwei Flüsse, zwei Modelle',html:'<p><strong>Energiefluss:</strong> Erzeugung → Netz → Entnahme. <strong>Informationsfluss:</strong> Rollen tauschen Zuordnung, Stammdaten, Messwerte und Abrechnungsergebnisse aus.</p><p class="callout">Marktkommunikation transportiert keine Elektronen. Sie schafft eine gemeinsame, prüfbare Sicht darauf, wer wann wofür verantwortlich ist.</p>'}],quiz:[{question:'Was ist der Hauptgrund für standardisierte Marktkommunikation?',options:['Der Strom fließt digital','Getrennte Marktrollen müssen dieselben fachlichen Tatsachen koordinieren','Zähler benötigen E-Mails'],answer:1},{question:'Was sollte dein Domänenmodell primär speichern?',options:['Nur EDIFACT-Dateien','Fachliche Tatsachen plus Herkunft und Gültigkeit','Screenshots von Nachrichten'],answer:1}],task:{title:'Ziehe die Systemgrenze',prompt:'Skizziere für einen Einzug je eine fachliche Tatsache, einen Sender und einen Empfänger.',answer:'<p>Beispiel: Tatsache <code>Lieferant L ist ab T einer MaLo zugeordnet</code>. Der Lieferant beantragt die Zuordnung, der Netzbetreiber prüft und bestätigt oder lehnt sie ab. Nachricht und Transportkanal bleiben Adapterdetails.</p>'},sources:[['EnWG – Gesetz über die Elektrizitäts- und Gasversorgung','https://www.gesetze-im-internet.de/enwg_2005/'],['Bundesnetzagentur: GPKE','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/831_gpke/gpke_basepage.html']],next:'02'};</script><script src="app.js"></script></body></html>
