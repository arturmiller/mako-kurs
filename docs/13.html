<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'13',minutes:35,title:'Bestätigung, Ablehnung und technische Fehler',lede:'Versendet bedeutet nicht angekommen, angekommen bedeutet nicht lesbar, und lesbar bedeutet noch lange nicht fachlich akzeptiert.',objectives:['Transport-, Syntax- und Fachstatus trennen','CONTRL, APERAK und fachliche Antworten einordnen','Duplikate idempotent behandeln','Timeouts und Klärfälle nachvollziehbar steuern'],chapters:[{title:'Drei Ebenen des Erfolgs',html:'<p>Die erste Ebene ist der Transport: Wurde die Datei oder Nachricht an den technischen Endpunkt übertragen? Die zweite Ebene ist die technische Verarbeitung: War Interchange und Nachricht syntaktisch lesbar? Die dritte Ebene ist das fachliche Ergebnis: Wurde der beantragte Vorgang bestätigt oder aus einem fachlichen Grund abgelehnt?</p><p>Diese Ebenen brauchen getrennte Zustände. Ein HTTP-Erfolg oder Dateiversand beweist keine fachliche Annahme. Umgekehrt kann eine korrekt gelesene Nachricht zu einer legitimen Ablehnung führen, ohne dass ein technischer Fehler vorliegt.</p>'},{title:'CONTRL, APERAK und Fachantwort',html:'<p>CONTRL dient der technischen Rückmeldung zur EDIFACT-Verarbeitung. APERAK meldet Fehler auf Anwendungsebene, wenn eine Nachricht zwar technisch verarbeitet werden kann, aber Anwendungsfehler enthält. Die fachliche Antwortnachricht entscheidet schließlich über den Geschäftsprozess, zum Beispiel Bestätigung oder Ablehnung eines Lieferbeginns.</p><p>Das System speichert jede Rückmeldung als eigenes Ereignis mit Referenz auf Interchange, Nachricht und Prozessinstanz. Ein zusammengefasstes Feld successful würde die entscheidende Frage verschleiern, auf welcher Ebene Erfolg oder Fehler festgestellt wurde.</p><pre class="model">OutboundMessage\n  TransportStatus\n  SyntaxAcknowledgement\n  ApplicationAcknowledgement\n  BusinessResponse\n  ProcessOutcome</pre>'},{title:'Korrelation und Idempotenz',html:'<p>Interchange-Referenz, Nachrichtenreferenz und Transaktionsreferenz haben unterschiedliche Reichweiten. Eine Korrelationsschicht verbindet Antworten mit der gesendeten Nachricht und dem fachlichen Prozess. Sie muss auch mehrere technische Übertragungsversuche derselben fachlichen Aussage erkennen.</p><p>Idempotenz bedeutet: Dieselbe fachliche Nachricht darf bei wiederholter Zustellung nicht doppelte Zuordnungen, Rechnungen oder Prozessschritte erzeugen. Dafür braucht es einen stabilen Idempotenzschlüssel und ein gespeichertes Verarbeitungsergebnis. Ein Duplikat erhält dieselbe Antwort oder wird kontrolliert ignoriert.</p>'},{title:'Timeout, Wiederholung und Klärfall',html:'<p>Ein Timeout sagt nur, dass innerhalb einer erwarteten Frist keine passende Antwort gefunden wurde. Er beweist nicht, dass der Empfänger die Nachricht nicht verarbeitet hat. Blindes Wiederholen kann deshalb Duplikate verschärfen. Retry-Regeln unterscheiden vorübergehende technische Fehler von fachlichen Ablehnungen.</p><p>Nach ausgeschöpften Wiederholungen gehört ein Vorgang in einen Dead-Letter- oder Klärbereich. Dort müssen Originalnachricht, Versuche, Antworten, Fristen und nächster verantwortlicher Bearbeiter sichtbar sein. Eine manuelle Korrektur erzeugt ein protokolliertes Ereignis und verändert nicht heimlich die Historie.</p>'}],quiz:[{question:'Was beweist eine CONTRL grundsätzlich?',options:['Den vollständigen fachlichen Prozesserfolg','Eine technische Rückmeldung zur EDIFACT-Verarbeitung','Die Bezahlung einer Rechnung'],answer:1},{question:'Was bedeutet ein Timeout sicher?',options:['Der Empfänger hat abgelehnt','Es fehlt innerhalb der Erwartungsfrist eine korrelierte Antwort','Die Nachricht wurde nie erzeugt'],answer:1},{question:'Was verhindert Idempotenz?',options:['Doppelte fachliche Wirkung bei Wiederholung','Jede Ablehnung','Zeitstempel'],answer:0}],task:{title:'Modelliere einen unsicheren Versand',prompt:'Eine Nachricht wurde gesendet, die Verbindung brach ab, später trifft eine Fachbestätigung ein.',answer:'<p>Der Transportversuch bleibt mit unbekanntem Ausgang dokumentiert. Die später korrelierte Fachbestätigung aktualisiert den fachlichen Prozess, ohne einen zweiten Antrag zu erzeugen. Ein Retry darf denselben Idempotenzschlüssel verwenden und keine doppelte Wirkung auslösen.</p>'},sources:[['Bundesnetzagentur: Datenformate und Nachrichtentypen','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/835_mitteilungen_datenformate/Datenformate-node.html'],['BDEW MaKo: EDI@Energy','https://www.bdew-mako.de/']],prev:'12',next:'14'};</script><script src="app.js"></script></body></html>
