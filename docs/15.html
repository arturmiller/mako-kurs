<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'15',minutes:40,title:'Messwertkorrekturen und Ersatzwertbildung',lede:'Im produktiven Betrieb fehlen Werte, widersprechen sich oder werden später korrigiert. Entscheidend ist nicht nur der neue Wert, sondern seine Wirkung auf alle abhängigen Ergebnisse.',objectives:['Original-, Ersatz- und Korrekturwerte unterscheiden','Messwertqualität und Herkunft modellieren','Widersprüche und Überschneidungen erkennen','betroffene Ergebnisse gezielt neu berechnen'],chapters:[{title:'Ein Wert braucht einen Status',html:'<p>Ein Messwert ist mehr als Zahl und Zeitpunkt. Er besitzt Quelle, Erfassungsart, Einheit, Qualität, Version und fachlichen Zeitraum. Ein gemessener Wert, eine Kundenablesung, eine Schätzung und ein Ersatzwert können denselben Zeitpunkt betreffen, haben aber nicht dieselbe Aussagekraft.</p><p>Fehlt ein erwarteter Wert, entsteht zunächst eine Lücke. Eine Ersatzwertbildung schließt diese Lücke nach einer dokumentierten Methode. Der Ersatzwert darf nicht so aussehen, als wäre er physisch gemessen worden. Methode, Eingabedaten und Regelversion gehören zur Provenienz.</p>'},{title:'Korrigierte MSCONS und Versionen',html:'<p>Eine spätere MSCONS kann einen bereits verarbeiteten Wert korrigieren. Das System identifiziert den fachlich betroffenen Wert über Messobjekt, Zeitbezug und Wertart. Es überschreibt die alte Beobachtung nicht, sondern erzeugt eine neue Version und markiert die bisher verwendete Version als abgelöst.</p><p>Bei Lastgängen betrifft eine Korrektur möglicherweise einzelne Intervalle einer langen Zeitreihe. Eine robuste Versionierung erlaubt Teilkorrekturen, ohne die komplette Herkunft der übrigen Intervalle zu verlieren. Zeitreihenversion und Intervallversion müssen deshalb bewusst zusammenspielen.</p><pre class="model">ReadingObservation { objectId, timestamp, value, quality, source }\nReadingVersion { observationId, version, receivedAt, supersedes }\nDerivedQuantity { period, inputVersionIds, methodVersion }</pre>'},{title:'Überschneidung und Zählerwechsel',html:'<p>Zwei Werte können denselben Zeitraum mit unterschiedlicher Quelle oder Qualität abdecken. Eine Prioritätsregel darf den Konflikt nicht unsichtbar machen. Das System dokumentiert beide Kandidaten, die angewendete Auswahlregel und gegebenenfalls einen Klärfall.</p><p>Beim Zählerwechsel müssen Ausbau- und Einbauwerte den richtigen Geräteinstallationen und Registern zugeordnet werden. Eine Verbrauchsdifferenz darf nicht über zwei Geräte gebildet werden, ohne Wechselstand, Wandlerfaktor und Gültigkeitsgrenzen zu berücksichtigen.</p>'},{title:'Auswirkungsanalyse statt Vollberechnung',html:'<p>Ein korrigierter Messwert kann Energiemengen, Kundenrechnungen, Netznutzungsprüfung, Bilanzkreiszeitreihen und Mehr- oder Mindermengen verändern. Jedes abgeleitete Ergebnis referenziert deshalb seine konkreten Eingabeversionen. So kann ein Dependency Resolver bestimmen, welche Ergebnisse veraltet wurden.</p><p>Die Neuberechnung erzeugt neue Ergebnisversionen. Bereits versendete Rechnungen werden storniert oder korrigiert, nicht überschrieben. Für jedes Ergebnis bleibt sichtbar, welche Messwertversion tatsächlich verwendet wurde.</p>'}],quiz:[{question:'Was unterscheidet einen Ersatzwert von einem Messwert?',options:['Nur die Farbe','Er wurde nach einer dokumentierten Methode abgeleitet','Nichts'],answer:1},{question:'Wie wird eine korrigierte MSCONS verarbeitet?',options:['Alten Wert ohne Spur überschreiben','Neue Wertversion mit Bezug zur abgelösten Version','Alle Rechnungen löschen'],answer:1},{question:'Was ermöglicht gezielte Neuberechnung?',options:['Referenzen auf konkrete Eingabeversionen','Ein globaler Neustart','Nur ein Freitext'],answer:0}],task:{title:'Verfolge eine Korrektur',prompt:'Ein Endstand sinkt nach Korrektur um 120 Kilowattstunden. Welche Ergebnisse prüfst du?',answer:'<p>Erzeuge eine neue Messwertversion. Ermittle daraus betroffene Energiemengen. Folge den gespeicherten Abhängigkeiten zu Kundenbilling, Netznutzungsprüfung und Bilanzierung. Markiere bisherige Ergebnisse als überholt und erzeuge neue Versionen beziehungsweise Storno und Neuabrechnung.</p>'},sources:[['Bundesnetzagentur: WiM','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/833_wim/wim_basepage.html'],['Bundesnetzagentur: Datenformate und MSCONS','https://www.bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/835_mitteilungen_datenformate/Datenformate-node.html']],prev:'14',next:'16'};</script><script src="app.js"></script></body></html>
