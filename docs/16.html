<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body><main></main><script>window.LESSON={no:'16',minutes:45,title:'Bilanzierung und MaBiS',lede:'Millionen einzelner Entnahmen werden zu Zeitreihen eines Bilanzkreises verdichtet. MaBiS definiert, wie Zuordnung, Aggregation, Abstimmung und Abrechnung zusammenwirken.',objectives:['Bilanzkreis und Bilanzierungsgebiet unterscheiden','SLP- und RLM-Bilanzierung einordnen','von Einzelmengen zu Summenzeitreihen gelangen','geltende MaBiS-Prozesse und MaBiS-Hub-Zielbild trennen'],chapters:[{title:'Verantwortung im Bilanzkreis',html:'<p>Ein Bilanzkreis bündelt Einspeisungen und Entnahmen unter der Verantwortung eines Bilanzkreisverantwortlichen. Das Bilanzierungsgebiet beschreibt den räumlich-organisatorischen Kontext der Netz- und Bilanzierungsprozesse. Eine Marktlokation ist über zeitgültige Stammdaten einem Lieferanten und einem Bilanzkreis zugeordnet.</p><p>Die Bilanzkreiszuordnung ist keine bloße Eigenschaft am Kundenvertrag. Sie besitzt eigenen Zeitraum, Quelle und Prozesshistorie. Eine falsche oder verspätete Zuordnung verschiebt Energiemengen zwischen Verantwortlichen und erzeugt wirtschaftliche Differenzen.</p>'},{title:'SLP, RLM und Prognose',html:'<p>Bei Standardlastprofilen wird eine nicht kontinuierlich gemessene Verbrauchsmenge über standardisierte Profile zeitlich verteilt. Prognoseverfahren bilden erwartete Lastverläufe. Bei registrierender Leistungsmessung liegen zeitlich aufgelöste Messwerte beziehungsweise Lastgänge vor. Beide Verfahren erzeugen Zeitreihen, aber aus unterschiedlichen Eingaben und Regeln.</p><p>Prognose und tatsächliche Menge sind unterschiedliche Versionen der energiewirtschaftlichen Sicht. Differenzen sind kein technischer Fehler, sondern Teil des Bilanzierungsproblems. Messwertkorrekturen oder Stammdatenänderungen können die Zeitreihen rückwirkend verändern.</p>'},{title:'Aggregation und Differenzmengen',html:'<p>Einzelne Zeitreihen werden nach bilanzierungsrelevanten Merkmalen gruppiert und zu Summenzeitreihen aggregiert. Zu diesen Merkmalen gehören insbesondere Bilanzkreis, Bilanzierungsgebiet, Lieferant, Zeit und Verfahren. Das Aggregationsergebnis muss die enthaltenen Eingabeversionen und Regeln nachweisen.</p><p>Abweichungen zwischen erwarteten, gemessenen und bilanzierten Mengen führen zu Differenzmengen. Mehr- und Mindermengen behandeln bestimmte Abweichungen zwischen bilanzierten und tatsächlich ermittelten Verbräuchen. Ihre Abrechnung ist ein eigener Prozess und darf nicht mit der Kundenrechnung gleichgesetzt werden.</p><pre class="model">Marktlokation und Messwerte\nBilanzkreiszuordnung und Verfahren\nZeitreihenbildung\nAggregation zu Summenzeitreihen\nAbstimmung und Clearing\nBilanzkreisabrechnung</pre>'},{title:'MaBiS heute und MaBiS-Hub',html:'<p>Die aktuell gültige MaBiS-Fassung regelt die Marktprozesse der Bilanzkreisabrechnung. Parallel entwickelt die Bundesnetzagentur im Verfahren BK6-24-210 ein Zielbild für einen zentralen MaBiS-Hub. Dieses Zielbild soll Aggregation und Abrechnung künftig stärker bündeln und die Verarbeitung großer Mengen an Last- und Zählerstandsgängen neu ausrichten.</p><p>Das Eckpunktepapier nennt eine angedachte Produktivsetzung in der zweiten Jahreshälfte 2028. Solange finale Vorgaben und technische Anlagen nicht in Kraft sind, behandelt die Architektur den Hub als versioniertes Zielbild. Stabile Domänenobjekte bleiben im Kern; heutige MaBiS-Nachrichten und künftige Hub-Schnittstellen liegen hinter getrennten Adaptern.</p>'}],quiz:[{question:'Was bündelt ein Bilanzkreis?',options:['Einspeisungen und Entnahmen unter einer Verantwortung','Nur Kundenadressen','Ausschließlich Rechnungs-PDFs'],answer:0},{question:'Was ist ein Standardlastprofil?',options:['Ein Verfahren zur zeitlichen Verteilung typischer Lastverläufe','Eine Bankverbindung','Eine EDIFACT-Quittung'],answer:0},{question:'Wie ist der MaBiS-Hub heute einzuordnen?',options:['Als bereits vollständig geltende Produktionsplattform','Als laufendes regulatorisches Zielbild','Als Kundenrechnung'],answer:1}],task:{title:'Baue eine Aggregationskette',prompt:'Welche Provenienz braucht eine Bilanzkreis-Summenzeitreihe?',answer:'<p>Sie referenziert die verwendeten Einzelzeitreihenversionen, zeitgültigen Bilanzkreiszuordnungen, Aggregationsmerkmale, Regelversion und Ausführungszeit. Eine Korrektur erzeugt eine neue Summenzeitreihenversion und lässt das frühere Ergebnis nachvollziehbar bestehen.</p>'},sources:[['Bundesnetzagentur: aktuell gültige MaBiS','https://bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/833_mabis/mabis_node.html'],['Bundesnetzagentur: MaBiS-Hub','https://bundesnetzagentur.de/DE/Beschlusskammern/BK06/BK6_83_Zug_Mess/845_MaBiS_Hub/BK6_MaBiS_Hub_node.html'],['Bundesnetzagentur: Eckpunktepapier BK6-24-210','https://www.bundesnetzagentur.de/DE/Beschlusskammern/1_GZ/BK6-GZ/2024/BK6-24-210/Eckpunktepapier/BK6-24-210_Eckpunktepapier.html']],prev:'15',next:'17'};</script><script src="app.js"></script></body></html>
